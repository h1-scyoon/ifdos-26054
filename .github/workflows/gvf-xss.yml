name: "<img src=x onerror=console.log('GVF_WORKFLOW_20260823')>"
run-name: "<img src=x onerror=console.log('GVF_RUNNAME_20260823')>"
on: [push, workflow_dispatch]
permissions:
  contents: read
  checks: write
jobs:
  fixture:
    name: "<img src=x onerror=console.log('GVF_JOB_20260823')>"
    runs-on: ubuntu-latest
    steps:
      - name: "<img src=x onerror=console.log('GVF_STEP_20260823')>"
        shell: bash
        run: |
          printf '\033]8;;javascript:console.error("GVF_OSC8_20260823")\aGVF_OSC8_LINK_20260823\033]8;;\a\n'
          printf '%s\n' 'javascript:console.error("GVF_RAW_JS_20260823")'
          printf '%s\n' 'data:text/html,<script>console.error("GVF_RAW_DATA_20260823")</script>'
          printf '%s\n' 'https://example.com/GVF_HTTP_20260823'
          printf '%s\n' '::notice title=<img/src=x/onerror=console.error(id) id=GVF_NOTICE_TITLE_20260823>::<img/src=x/onerror=console.error(id) id=GVF_NOTICE_BODY_20260823>'
          {
            printf '%s\n' '# GVF_SUMMARY_20260823'
            printf '%s\n' '[GVF_SUMMARY_JS_20260823](javascript:console.error("GVF_SUMMARY_JS_20260823"))'
            printf '%s\n' '[GVF_SUMMARY_DATA_20260823](data:text/html,<script>console.error("GVF_SUMMARY_DATA_20260823")</script>)'
            printf '%s\n' '<img src=x onerror=console.error("GVF_SUMMARY_HTML_20260823")>'
          } >> "$GITHUB_STEP_SUMMARY"
