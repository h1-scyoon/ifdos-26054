name: "<img src=x onerror=console.log('GVF_WORKFLOW_20260823')>"
run-name: "<img src=x onerror=console.log('GVF_RUNNAME_20260823')>"
on: [push]
permissions:
  contents: read
  checks: write
jobs:
  fixture:
    name: "<img src=x onerror=console.log('GVF_JOB_20260823')>"
    runs-on: ubuntu-latest
    steps:
      - name: "<img src=x onerror=console.log('GVF_STEP_20260823')>"
        run: "true"
      - name: Create URL-scheme check fixtures
        uses: actions/github-script@v7
        with:
          script: |
            const candidates = [
              ['js-lower', 'javascript:console.error("GVF_CHECK_JS_26054")'],
              ['js-mixed', 'JaVaScRiPt:console.error("GVF_CHECK_MIXED_26054")'],
              ['data-html', 'data:text/html,<script>console.error("GVF_CHECK_DATA_26054")</script>'],
            ]
            for (const [suffix, details_url] of candidates) {
              try {
                const response = await github.rest.checks.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: `GVF_CHECK_URL_26054_${suffix}`,
                  head_sha: context.sha,
                  status: 'completed',
                  conclusion: 'success',
                  details_url,
                  output: {
                    title: `GVF_CHECK_URL_26054_${suffix}`,
                    summary: `GVF_CHECK_URL_26054_${suffix}`,
                  },
                })
                core.info(`accepted ${suffix}: ${response.data.id} ${response.data.details_url}`)
              } catch (error) {
                core.warning(`rejected ${suffix}: ${error.status} ${JSON.stringify(error.response?.data)}`)
              }
            }
